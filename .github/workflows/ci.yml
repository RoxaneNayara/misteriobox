# Integração contínua da MistérioBox.
# Executa lint, verificação de formatação, build, testes automatizados e de ponta a ponta.
# Não depende de nenhuma aplicação hospedada: tudo roda dentro do runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, formatação e build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # O binário do MongoDB não é baixado no `npm ci`; os testes de integração o
      # obtêm sob demanda e ele fica em cache entre execuções (passo abaixo).
      MONGOMS_DISABLE_POSTINSTALL: '1'

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Cache do binário do MongoDB (testes de integração)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: ESLint (backend e frontend)
        run: npm run lint

      - name: Prettier (verificação de formatação)
        run: npm run format:check

      - name: Build do backend
        run: npm run build -w backend

      - name: Build do frontend
        run: npm run build -w frontend

      - name: Testes automatizados do backend (Vitest + Supertest)
        run: npm run test -w backend

      - name: Testes automatizados do frontend (Vitest)
        run: npm run test -w frontend

      - name: Verificação de tipos dos testes de ponta a ponta
        run: npm run typecheck:e2e

      - name: Instalar navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Sobe o build da API (porta 3400) e o `vite preview` (porta 4173) no próprio runner.
      - name: Testes de ponta a ponta (Playwright)
        run:
          npm run test:e2e

          # Suíte acadêmica de automação em JavaScript
      - name: Testes QA JavaScript - API (Mocha, Chai e Supertest)
        env:
          PORT: '3333'
          JWT_SECRET: 'segredo-exclusivo-dos-testes-qa'
          BCRYPT_SALT_ROUNDS: '4'
          DEMO_USER_SOFIA_PASSWORD: 'SenhaDemoQa01'
          DEMO_USER_BRUNO_PASSWORD: 'SenhaDemoQa02'
          DEMO_USER_LIVIA_PASSWORD: 'SenhaDemoQa03'
        run: |
          node backend/dist/server.js > /tmp/misteriobox-qa-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:3333/api/health > /dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/misteriobox-qa-api.log
            exit 1
          fi

          npx mocha "tests/gestaodeusuarios/api/*.test.mjs"

      - name: Testes QA JavaScript - UI (Playwright)
        run: npx playwright test --config=playwright.qa.config.js

      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
