openapi: 3.0.3
info:
  title: MistérioBox API
  version: 1.0.0
  description: |
    API REST da **MistérioBox**, plataforma de investigação interativa.

    **Formato das respostas**
    - Sucesso: `{ "data": ... }`
    - Erro: `{ "error": { "code": "CODIGO", "message": "Mensagem legível", "details": ... } }`

    **Autenticação**: envie o token obtido em `/auth/login` ou `/auth/register` no cabeçalho
    `Authorization: Bearer <token>`.

    **Sessão (inatividade e limite absoluto)**: cada token expira após **30 minutos** sem renovação
    (`idleTimeoutSeconds`). Enquanto o jogador está ativo, o site chama `POST /auth/refresh`, que
    emite um novo token deslizando a janela de inatividade, sem ultrapassar **8 horas** desde o
    login (`sessionExpiresAt`). Token expirado: `401 SESSION_EXPIRED`. O logout é feito pelo
    cliente, descartando o token; um token copiado antes do logout continua aceito até expirar
    (no máximo 30 minutos sem renovação). Logout e expiração não abandonam investigações (RN06).

    **Corpo das requisições**: requisições com corpo devem usar `Content-Type: application/json`
    (com ou sem `charset`). Outros tipos de mídia recebem `415 UNSUPPORTED_MEDIA_TYPE` antes de
    qualquer processamento, sem efeitos no banco. POSTs sem corpo (dica, abandono, análise,
    renovação) não são afetados.

    **Cache**: as respostas da API usam `Cache-Control: no-store`.

    **Segurança das soluções**: o suspeito culpado, a evidência decisiva e a explicação do caso
    só são retornados em `/investigations/{investigationId}/result` e na resposta da acusação,
    depois que a investigação é finalizada por acusação.
servers:
  - url: http://localhost:3333/api
    description: Ambiente local
tags:
  - name: Saúde
  - name: Autenticação
  - name: Missões
  - name: Investigações

paths:
  /health:
    get:
      tags: [Saúde]
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Autenticação]
      summary: Cadastra um novo jogador e já retorna uma sessão
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { name: 'Ana Souza', email: 'ana@example.com', password: 'Senha123' }
      responses:
        '201':
          description: Jogador cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '409':
          description: E-mail já cadastrado (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: EMAIL_ALREADY_REGISTERED, message: Este e-mail já está cadastrado. }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um jogador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: 'sofia@example.com', password: 'SenhaDefinidaNoEnv1' }
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
              example:
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  tokenType: Bearer
                  expiresIn: 1800
                  idleTimeoutSeconds: 1800
                  sessionExpiresAt: '2026-11-18T20:00:00.000Z'
                  user:
                    id: 674b1f0c2a9d4e0012345678
                    name: Sofia Almeida
                    email: sofia@example.com
                    createdAt: '2026-11-18T12:00:00.000Z'
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401':
          description: E-mail ou senha incorretos (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: { code: INVALID_CREDENTIALS, message: E-mail ou senha incorretos. }

  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Renova a janela de inatividade da sessão
      description: |
        Emite um novo token para a sessão atual, com nova expiração por inatividade
        (`idleTimeoutSeconds`, 30 min), mantendo o momento do login: a expiração absoluta
        (`sessionExpiresAt`, 8 h após o login) nunca é estendida. Não exige corpo. O token
        anterior continua válido até a própria expiração.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessão renovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna o jogador autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Jogador autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /missions:
    get:
      tags: [Missões]
      summary: Lista o catálogo de missões
      description: |
        Rota pública. Se um token válido for enviado, cada missão inclui a tentativa em andamento
        do próprio jogador ou, se não houver, a tentativa mais recente (`null` se ele nunca jogou),
        além do total de tentativas registradas.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Catálogo de missões
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MissionCatalogItem' }
              example:
                data:
                  - id: missao-001
                    title: O Último Aplauso
                    theme: Roubo em um teatro
                    synopsis: Na noite de estreia de uma peça, um violino histórico desaparece...
                    difficulty: FACIL
                    difficultyLabel: Fácil
                    totalEvidences: 5
                    totalSuspects: 3
                    totalHints: 2
                    investigation: { id: 674b1f0c2a9d4e0012345679, status: EM_ANDAMENTO }
                    totalAttempts: 2
        '401': { $ref: '#/components/responses/Unauthorized' }

  /missions/{missionId}:
    get:
      tags: [Missões]
      summary: Consulta os detalhes públicos de uma missão
      description: Retorna história e suspeitos. Não retorna o conteúdo das evidências nem a solução.
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Detalhes públicos da missão
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MissionDetails' }
        '404': { $ref: '#/components/responses/NotFound' }

  /investigations:
    get:
      tags: [Investigações]
      summary: Consulta o histórico de investigações do jogador autenticado
      description: |
        Lista todas as tentativas do próprio jogador (identificado pelo token), da mais recente para
        a mais antiga. Não aceita identificador de usuário: não é possível consultar o histórico de
        outro jogador. Os registros não trazem acusação nem solução. `score` e `classification` são
        `null` quando não houve pontuação (tentativa em andamento ou abandonada) e numéricos —
        inclusive `0` — quando a tentativa foi finalizada por acusação. O histórico existe enquanto o
        backend estiver em execução (banco em memória).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Histórico do jogador (lista vazia quando ainda não há tentativas)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InvestigationHistoryItem' }
              example:
                data:
                  - id: 674b1f0c2a9d4e0012345680
                    mission:
                      {
                        id: missao-001,
                        title: O Último Aplauso,
                        difficulty: FACIL,
                        difficultyLabel: Fácil,
                      }
                    attemptNumber: 2
                    status: ABANDONADO
                    startedAt: '2026-11-18T13:00:00.000Z'
                    finishedAt: '2026-11-18T13:05:00.000Z'
                    analyzedEvidences: 1
                    totalEvidences: 5
                    hintsUsed: 0
                    score: null
                    classification: null
                  - id: 674b1f0c2a9d4e0012345679
                    mission:
                      {
                        id: missao-001,
                        title: O Último Aplauso,
                        difficulty: FACIL,
                        difficultyLabel: Fácil,
                      }
                    attemptNumber: 1
                    status: NAO_SOLUCIONADO
                    startedAt: '2026-11-18T12:00:00.000Z'
                    finishedAt: '2026-11-18T12:20:00.000Z'
                    analyzedEvidences: 3
                    totalEvidences: 5
                    hintsUsed: 0
                    score: 0
                    classification: Investigação Inconclusiva
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Investigações]
      summary: Inicia uma nova tentativa de investigação
      description: |
        Cria uma nova tentativa da missão com número sequencial (`attemptNumber`), sem evidências
        analisadas, sem dicas e sem acusação. Tentativas encerradas (`SOLUCIONADO`,
        `NAO_SOLUCIONADO`, `ABANDONADO`) permanecem inalteradas no histórico. Só pode existir uma
        tentativa `EM_ANDAMENTO` por jogador e missão, garantida por índice único no banco mesmo
        com requisições simultâneas.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInvestigationRequest' }
            example: { missionId: missao-001 }
      responses:
        '201':
          description: Investigação criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Já existe uma tentativa em andamento desta missão (`INVESTIGATION_ALREADY_EXISTS`); o campo
            `details.investigationId` indica a investigação a ser continuada. Em corridas raras de
            requisições simultâneas pode ser retornado `CONCURRENT_UPDATE` (tente novamente).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INVESTIGATION_ALREADY_EXISTS
                  message: Você já possui uma investigação em andamento para esta missão. Continue a investigação existente.
                  details: { investigationId: 674b1f0c2a9d4e0012345679, status: EM_ANDAMENTO }

  /investigations/{investigationId}:
    get:
      tags: [Investigações]
      summary: Consulta o progresso de uma investigação
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      responses:
        '200':
          description: Progresso atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /investigations/{investigationId}/evidences/{evidenceId}/analysis:
    post:
      tags: [Investigações]
      summary: Analisa uma evidência
      description: |
        Registra a análise e salva o progresso automaticamente. Evidências cujos pré-requisitos
        foram cumpridos passam a ficar disponíveis.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, example: ev-01 }
      responses:
        '200':
          description: Evidência analisada; retorna o progresso atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Investigação finalizada (`INVESTIGATION_FINISHED`) ou evidência já analisada (`EVIDENCE_ALREADY_ANALYZED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Evidência bloqueada (`EVIDENCE_LOCKED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: EVIDENCE_LOCKED
                  message: Esta evidência está bloqueada. Analise primeiro as evidências exigidas.
                  details: { missingRequirements: [ev-01] }

  /investigations/{investigationId}/hints:
    post:
      tags: [Investigações]
      summary: Consulta a próxima dica
      description: Cada dica utilizada desconta 10 pontos da pontuação final.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      responses:
        '200':
          description: Dica revelada; retorna o progresso atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Investigação finalizada (`INVESTIGATION_FINISHED`) ou sem dicas restantes (`NO_HINTS_REMAINING`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /investigations/{investigationId}/abandon:
    post:
      tags: [Investigações]
      summary: Abandona a investigação
      description: A investigação recebe o status `ABANDONADO`, não recebe pontuação e não pode ser retomada.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      responses:
        '200':
          description: Investigação abandonada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationProgressResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvestigationFinished' }

  /investigations/{investigationId}/accusation:
    post:
      tags: [Investigações]
      summary: Envia a acusação definitiva
      description: |
        Exige pelo menos 3 evidências analisadas. A evidência escolhida precisa ter sido analisada.
        Só é permitida uma acusação por investigação. A pontuação é calculada no servidor;
        campos extras no corpo (como `score`) são rejeitados.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccusationRequest' }
            example: { suspectId: clara-monteiro, evidenceId: ev-04 }
      responses:
        '200':
          description: Acusação registrada; retorna o relatório final
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationResultResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvestigationFinished' }
        '422':
          description: |
            Regra de acusação violada: `INSUFFICIENT_EVIDENCES`, `INVALID_SUSPECT` ou `EVIDENCE_NOT_ANALYZED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  code: INSUFFICIENT_EVIDENCES
                  message: Analise pelo menos 3 evidências antes de acusar.
                  details: { analyzedEvidences: 1, minimumForAccusation: 3 }

  /investigations/{investigationId}/result:
    get:
      tags: [Investigações]
      summary: Consulta o resultado de uma investigação finalizada
      description: |
        Disponível para investigações `SOLUCIONADO`, `NAO_SOLUCIONADO` ou `ABANDONADO`.
        A solução (`solution`) só é preenchida quando houve acusação.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/InvestigationId'
      responses:
        '200':
          description: Relatório final
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestigationResultResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Investigação ainda em andamento (`INVESTIGATION_IN_PROGRESS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, example: missao-001 }
    InvestigationId:
      name: investigationId
      in: path
      required: true
      description: Identificador da investigação (ObjectId com 24 caracteres hexadecimais)
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$', example: 674b1f0c2a9d4e0012345679 }

  responses:
    ValidationError:
      description: Dados inválidos (`VALIDATION_ERROR` ou `INVALID_JSON`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Dados da requisição inválidos.
              details: [{ field: email, message: Informe um e-mail válido. }]
    Unauthorized:
      description: |
        Token ausente ou inválido (`UNAUTHORIZED`) ou sessão expirada por inatividade ou pelo
        limite absoluto (`SESSION_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: SESSION_EXPIRED
              message: Sua sessão expirou por inatividade. Entre novamente.
    UnsupportedMediaType:
      description: |
        O corpo não foi enviado como `application/json` (`UNSUPPORTED_MEDIA_TYPE`). Nada é
        processado nem gravado. Refere-se ao cabeçalho `Content-Type` da requisição; a resposta
        continua em JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: 'Tipo de conteúdo não suportado. Envie o corpo em JSON com o cabeçalho Content-Type: application/json.'
              details: { receivedContentType: text/plain }
    Forbidden:
      description: A investigação pertence a outro jogador (`FORBIDDEN`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: FORBIDDEN, message: Esta investigação pertence a outro jogador. }
    NotFound:
      description: |
        Recurso inexistente (`MISSION_NOT_FOUND`, `INVESTIGATION_NOT_FOUND`, `EVIDENCE_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: INVESTIGATION_NOT_FOUND, message: Investigação não encontrada. }
    InvestigationFinished:
      description: A investigação já foi finalizada (`INVESTIGATION_FINISHED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: INVESTIGATION_FINISHED
              message: Esta investigação já foi finalizada e não aceita novas ações.
              details: { status: SOLUCIONADO }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - INVALID_JSON
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - ROUTE_NOT_FOUND
                - MISSION_NOT_FOUND
                - INVESTIGATION_NOT_FOUND
                - EVIDENCE_NOT_FOUND
                - EMAIL_ALREADY_REGISTERED
                - INVESTIGATION_ALREADY_EXISTS
                - INVESTIGATION_FINISHED
                - INVESTIGATION_IN_PROGRESS
                - EVIDENCE_ALREADY_ANALYZED
                - NO_HINTS_REMAINING
                - CONCURRENT_UPDATE
                - UNSUPPORTED_MEDIA_TYPE
                - SESSION_EXPIRED
                - EVIDENCE_LOCKED
                - INSUFFICIENT_EVIDENCES
                - INVALID_SUSPECT
                - EVIDENCE_NOT_ANALYZED
                - INTERNAL_ERROR
            message: { type: string }
            details: {}

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 120 }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Deve conter pelo menos uma letra e um número.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    AuthSessionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            tokenType: { type: string, enum: [Bearer] }
            expiresIn:
              type: integer
              description: Segundos até este token expirar (renovável, limitado à expiração absoluta)
              example: 1800
            idleTimeoutSeconds:
              type: integer
              description: Tempo máximo sem renovação antes de a sessão expirar por inatividade
              example: 1800
            sessionExpiresAt:
              type: string
              format: date-time
              description: Expiração absoluta da sessão (8 horas após o login)
            user: { $ref: '#/components/schemas/User' }

    Difficulty:
      type: string
      enum: [FACIL, MEDIO, DIFICIL]

    InvestigationStatus:
      type: string
      enum: [EM_ANDAMENTO, SOLUCIONADO, NAO_SOLUCIONADO, ABANDONADO]

    Classification:
      type: string
      nullable: true
      enum:
        - Detetive Mestre
        - Investigador Experiente
        - Detetive Aprendiz
        - Investigação Inconclusiva

    MissionSummary:
      type: object
      properties:
        id: { type: string, example: missao-001 }
        title: { type: string }
        theme: { type: string }
        synopsis: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        difficultyLabel: { type: string, enum: [Fácil, Médio, Difícil] }
        totalEvidences: { type: integer }
        totalSuspects: { type: integer }
        totalHints: { type: integer }

    MissionCatalogItem:
